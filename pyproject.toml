[project]
name = "arbol-root"
version = "1.0.0"
description = "Arbol Root: the Root manager, its layouts and the Root Contract suite."
requires-python = "==3.14.8"
dependencies = []

[dependency-groups]
dev = ["mypy==1.19.1", "ruff==0.14.14"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src", "contract/conformance", "roots/sapling/drills"]
files = ["src", "tests", "scripts", "roots/sapling/drills", "bin/entry.py", "contract/conformance/rct_conformance", "contract/conformance/tests", "contract/conformance/standin/driver.py",
         "contract/conformance/bin/rct-conformance.py"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
